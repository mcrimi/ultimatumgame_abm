[project]
name = "ultimatum-abm"
version = "2.0.0"
description = "An agent-based power-to-take game: how shame and greed set the price of taking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mariano Crimi" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.scripts]
ultimatum-abm = "ultimatum_abm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
report = ["matplotlib>=3.9", "jupyter>=1.1", "pandas>=2.2", "tabulate>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimatum_abm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
